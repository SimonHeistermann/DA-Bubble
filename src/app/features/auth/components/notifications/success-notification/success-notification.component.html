<div class="success__notification" [ngClass]="{ show: show }">
    <button class="close__button" (click)="onClose()" aria-label="Schließen">✕</button>
    <div class="success__content">
      <div class="success__icon">
        <img src="/icons/email_send_icon.png" alt="Success Icon" />
      </div>
      <div class="success__text">
        <h3>{{ message }}</h3>
      </div>
    </div>
</div>
