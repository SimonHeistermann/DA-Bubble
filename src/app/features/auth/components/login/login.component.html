<app-intro-animation 
  *ngIf="showIntro"
  (animationComplete)="onIntroComplete()">
</app-intro-animation>

<div class="auth__container" *ngIf="!showIntro">
  <div class="auth__form__container">
    <div class="auth__form__header">
      <h1>Anmeldung</h1>
      <p>Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.</p>
    </div>
    <div class="auth__form__content">
      <form
        class="auth__form"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        [ngClass]="{ submitting: isAnyLoginInProgress }"
        novalidate
        aria-labelledby="login-form-title"
      >
        <h2 id="login-form-title" class="visually__hidden">Anmeldeformular</h2>
        <div class="honeypot" style="position: absolute; left: -9999px; visibility: hidden;">
          <label for="honeypot-field">Website (bitte leer lassen):</label>
          <input 
            type="text" 
            id="honeypot-field" 
            name="honeypot" 
            formControlName="honeypot" 
            tabindex="-1" 
            autocomplete="off"
            aria-hidden="true"
          >
        </div>
        <div class="form__fields">
          <div class="form__field">
            <div
              class="form__group"
              id="email-group"
              [ngClass]="{
                error__state: isFieldInvalid('email'),
                has__content: hasFieldContent('email'),
                valid__state: isFieldValid('email')
              }"
            >
              <div class="input__wrapper">
                <label for="email">
                  <img 
                    class="input__icon" 
                    src="images/icons/mail_icon_black.png" 
                    draggable="false" 
                    alt="E-Mail Icon" 
                  />
                </label>
                <input
                  type="email"
                  id="email"
                  inputmode="email"
                  formControlName="email"
                  placeholder="beispielname@email.com"
                  class="form__input"
                  autocomplete="email"
                  name="email"
                  [attr.aria-invalid]="isFieldInvalid('email')"
                  [attr.aria-describedby]="isFieldInvalid('email') ? 'email-error' : null"
                />
              </div>
              <div 
                class="error" 
                *ngIf="getFieldError('email')" 
                id="email-error"
                role="alert"
              >
                <small>{{ getFieldError('email') }}</small>
              </div>
            </div>
          </div>
          <div class="form__field">
            <div
              class="form__group"
              id="password-group"
              [ngClass]="{
                error__state: isFieldInvalid('password'),
                has__content: hasFieldContent('password'),
                valid__state: isFieldValid('password')
              }"
            >
              <div class="input__wrapper">
                <label for="password">
                  <img 
                    class="input__icon" 
                    src="images/icons/lock_icon_black.png" 
                    draggable="false" 
                    alt="Passwort Icon" 
                  />
                </label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  formControlName="password"
                  placeholder="Passwort"
                  class="form__input"
                  autocomplete="current-password"
                  [attr.aria-invalid]="isFieldInvalid('password')"
                  [attr.aria-describedby]="isFieldInvalid('password') ? 'password-error' : null"
                />
              </div>
              <div 
                class="error" 
                *ngIf="getFieldError('password')" 
                id="password-error"
                role="alert"
              >
                <small>{{ getFieldError('password') }}</small>
              </div>
            </div>
          </div>
        </div>
        <div class="form__bottom">
          <a
            class="link"
            [routerLink]="['/auth/forgot-password']"
            rel="noopener noreferrer"
            data-label="Passwort vergessen?"
            role="button"
            tabindex="0"
          >
            Passwort vergessen?
          </a>
          <div class="divider">
            <span>ODER</span>
          </div>
          <button
            type="button"
            class="btn btn__google"
            (click)="onGoogleSignIn()"
            [disabled]="isAnyLoginInProgress"
            [attr.aria-busy]="loading"
            aria-label="Mit Google anmelden"
          >
            <span class="btn__icon" aria-hidden="true"></span>
            <span *ngIf="!loading">Anmelden mit Google</span>
            <span *ngIf="loading">
              Wird angemeldet...
              <div class="loading__spinner" aria-hidden="true"></div>
            </span>
          </button>
          <div class="btn__box">
            <button
              type="submit"
              class="btn btn__primary"
              [disabled]="!canSubmit"
              [attr.aria-busy]="loading"
            >
              <span *ngIf="!loading">
                Anmelden
              </span>
              <span *ngIf="loading">
                Wird angemeldet...
                <div class="loading__spinner" aria-hidden="true"></div>
              </span>
            </button>
            <button
              type="button"
              class="btn btn__secondary"
              (click)="onGuestLogin()"
              [disabled]="!canGuestLogin"
              [attr.aria-busy]="guestLoading"
              aria-label="Als Gast anmelden"
            >
              <span *ngIf="!guestLoading">
                Gäste-Login
              </span>
              <span *ngIf="guestLoading">
                Wird geladen...
                <div class="loading__spinner" aria-hidden="true"></div>
              </span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<app-overlay 
  [show]="(notificationService.showSuccess$ | async) || (notificationService.showError$ | async)"
  (clicked)="hideAllNotifications()">
</app-overlay>

<app-success-notification 
  [show]="notificationService.showSuccess$ | async"
  [message]="notificationService.successMessage$ | async"
  (close)="notificationService.clearSuccess()">
</app-success-notification>

<app-error-notification 
  [show]="notificationService.showError$ | async"
  [message]="notificationService.errorMessage$ | async"
  (close)="notificationService.clearError()">
</app-error-notification>
