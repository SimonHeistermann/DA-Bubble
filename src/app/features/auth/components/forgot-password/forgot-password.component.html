<div class="auth__container">
    <div class="auth__form__container">
      <div class="auth__form__header">
        <div class="back__arrow" (click)="goBack()"></div>
        <h1>Passwort zurücksetzen</h1>
      </div>
      <div class="auth__form__content">
        <p>Bitte geben Sie Ihre E-Mail-Adresse ein.</p>
        <form
          class="auth__form"
          [formGroup]="forgotPasswordForm"
          (ngSubmit)="onSubmit()"
          [ngClass]="{ submitting: loading }"
          novalidate
          aria-labelledby="forgot-password-form-title"
        >
          <h2 id="forgot-password-form-title" class="visually__hidden">Passwort zurücksetzen Formular</h2>
          <div class="honeypot__field" style="position: absolute; left: -9999px; opacity: 0; pointer-events: none;">
            <label for="website">Website (nicht ausfüllen):</label>
            <input
              type="text"
              id="website"
              name="website"
              formControlName="website"
              tabindex="-1"
              autocomplete="off"
              placeholder="Lassen Sie dieses Feld leer"
            />
          </div>
          <div class="form__fields">
            <div class="form__field">
              <div
                class="form__group"
                id="email-group"
                [ngClass]="{
                  error__state: isFieldInvalid('email'),
                  has__content: hasFieldContent('email')
                }"
              >
                <div class="input__wrapper">
                  <label for="email">
                    <img class="input__icon" src="images/icons/mail_icon_black.png" draggable="false" alt="E-Mail Icon" />
                  </label>
                  <input
                    type="email"
                    id="email"
                    inputmode="email"
                    formControlName="email"
                    placeholder="beispielname@email.com"
                    class="form__input"
                    autocomplete="email"
                    name="email"
                    [attr.aria-invalid]="isFieldInvalid('email')"
                    [attr.aria-describedby]="isFieldInvalid('email') ? 'email-error' : null"
                  />
                </div>
                <div class="error" *ngIf="getFieldError('email')" id="email-error">
                  <small>{{ getFieldError('email') }}</small>
                </div>
              </div>
            </div>
          </div>
          <div class="info__text">
            <p>Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</p>
          </div>
          <div class="form__bottom">
            <div class="btn__box--single">
              <button
                type="submit"
                class="btn btn__primary btn__send"
                [disabled]="!canSubmitForm"
                [attr.aria-busy]="loading"
              >
                <span *ngIf="!loading">
                  E-Mail senden
                </span>
                <span *ngIf="loading">
                  Wird gesendet...
                  <div class="loading__spinner"></div>
                </span>
              </button>
            </div>
            <div *ngIf="remainingTime > 0" class="rate__limit__info">
              <small>Zu viele Versuche. Bitte warten Sie {{ remainingTime }} Sekunden.</small>
            </div>
          </div>
        </form>
      </div>
    </div>
</div>
<app-overlay 
  [show]="(notificationService.showSuccess$ | async) || (notificationService.showError$ | async)"
  (clicked)="hideAllNotifications()">
</app-overlay>

<app-success-notification 
  [show]="notificationService.showSuccess$ | async"
  [message]="notificationService.successMessage$ | async"
  (close)="notificationService.clearSuccess()">
</app-success-notification>

<app-error-notification 
  [show]="notificationService.showError$ | async"
  [message]="notificationService.errorMessage$ | async"
  (close)="notificationService.clearError()">
</app-error-notification>
