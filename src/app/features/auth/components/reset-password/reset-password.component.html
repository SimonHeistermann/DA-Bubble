<div class="auth__container">
    <div class="auth__form__container">
      <div class="auth__form__header">
        <div class="back__arrow" (click)="goBack()"></div>
        <h1>Passwort zurücksetzen</h1>
      </div>
      <div class="auth__form__content">
        <p *ngIf="userEmail">Neues Passwort für: <strong>{{ userEmail }}</strong></p>
        <form
          class="auth__form"
          [formGroup]="resetPasswordForm"
          (ngSubmit)="onSubmit()"
          [ngClass]="{ submitting: loading }"
          novalidate
          aria-labelledby="reset-password-form-title"
        >
          <h2 id="reset-password-form-title" class="visually__hidden">Neues Passwort setzen Formular</h2>
          
          <div class="form__fields">
            <div class="form__field">
              <div
                class="form__group"
                id="new-password-group"
                [ngClass]="{
                  error__state: isFieldInvalid('newPassword'),
                  has__content: hasFieldContent('newPassword')
                }"
              >
                <div class="input__wrapper">
                  <label for="newPassword">
                    <img class="input__icon" src="/icons/lock_icon_black.png" draggable="false" alt="Passwort Icon" />
                  </label>
                  <input
                    type="password"
                    id="newPassword"
                    formControlName="newPassword"
                    placeholder="Neues Passwort"
                    class="form__input"
                    autocomplete="new-password"
                    name="newPassword"
                    [attr.aria-invalid]="isFieldInvalid('newPassword')"
                    [attr.aria-describedby]="isFieldInvalid('newPassword') ? 'new-password-error' : null"
                  />
                </div>
                <div class="error" *ngIf="getFieldError('newPassword')" id="new-password-error">
                  <small>{{ getFieldError('newPassword') }}</small>
                </div>
              </div>
            </div>
            <div class="form__field">
              <div
                class="form__group"
                id="confirm-password-group"
                [ngClass]="{
                  error__state: isFieldInvalid('confirmPassword'),
                  has__content: hasFieldContent('confirmPassword')
                }"
              >
                <div class="input__wrapper">
                  <label for="confirmPassword">
                    <img class="input__icon" src="/icons/lock_icon_black.png" draggable="false" alt="Passwort bestätigen Icon" />
                  </label>
                  <input
                    type="password"
                    id="confirmPassword"
                    formControlName="confirmPassword"
                    placeholder="Neues Passwort bestätigen"
                    class="form__input"
                    autocomplete="new-password"
                    name="confirmPassword"
                    [attr.aria-invalid]="isFieldInvalid('confirmPassword')"
                    [attr.aria-describedby]="isFieldInvalid('confirmPassword') ? 'confirm-password-error' : null"
                  />
                </div>
                <div class="error" *ngIf="getFieldError('confirmPassword')" id="confirm-password-error">
                  <small>{{ getFieldError('confirmPassword') }}</small>
                </div>
              </div>
            </div>
          </div>

          <div class="form__bottom">
            <div class="btn__box--single">
              <button
                type="submit"
                class="btn btn__primary btn__send"
                [disabled]="!canSubmitForm"
                [attr.aria-busy]="loading"
              >
                <span *ngIf="!loading">
                  Passwort ändern
                </span>
                <span *ngIf="loading">
                  Wird gespeichert...
                  <div class="loading__spinner"></div>
                </span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
</div>

<app-overlay 
  [show]="(notificationService.showSuccess$ | async) || (notificationService.showError$ | async)"
  (clicked)="hideAllNotifications()">
</app-overlay>

<app-success-notification 
  [show]="notificationService.showSuccess$ | async"
  [message]="notificationService.successMessage$ | async"
  (close)="notificationService.clearSuccess()">
</app-success-notification>

<app-error-notification 
  [show]="notificationService.showError$ | async"
  [message]="notificationService.errorMessage$ | async"
  (close)="notificationService.clearError()">
</app-error-notification>
