 <div class="message-content-container">
    @if (isEditing && message?.content != null) {
        <app-input [allChannelUser]="allUsersWithOutCurrentUser" (saveEditingEmitter)="onSaveEditing($event)" (breakEditingEmitter)="onBreakEditing()" [editingMode]="true" [originalInputMessage]="message?.content"></app-input>
    }
    <p>
        {{ message?.content }}
    </p>
   
 </div>
