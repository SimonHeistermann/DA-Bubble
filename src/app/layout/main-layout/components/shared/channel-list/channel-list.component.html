<ngx-simplebar class="simple-bar" [ngStyle]="{'max-height': maxHeight}">
    <div class="ul-list-container" #listContainer>
        <ul>
            @for(c of channels; let index = $index; track $index) {
                <li class="pointer" (click)="clickLi(c)">
                        <span class="name">
                            {{ c.name }}
                        </span>
                </li>
            } @empty {
                <li class="no-li">Keine Channel gefunden</li>
            }
            
        </ul>
    </div>
</ngx-simplebar>
