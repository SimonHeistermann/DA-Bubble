<div class="container">
    <a 
        class="logo" 
        [routerLink]="['/auth/login']" 
        rel="noopener noreferrer"
    >
      <img src="images/icons/logo.png" draggable="false">
    </a>
  
    <div class="header__right" *ngIf="isLoginPage">
      <span>Neu bei DABubble?</span>
      <a 
        [routerLink]="['/auth/register']" 
        rel="noopener noreferrer"
        data-label="Account erstellen"
      >
        Account erstellen
      </a>
    </div>
</div>
